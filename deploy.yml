name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.20.8'

      - name: Compress Backend
        run: |
          tar -czf deploy.tar.gz Backend/

      - name: Send files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/home/ubuntu/My-Dairy"

      - name: Unzip and Restart Backend Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/My-Dairy
            tar -xzf deploy.tar.gz

            # Update and Restart Backend
            cd Backend
            npm install
            pm2 restart my-dairy || pm2 start npm --name "my-dairy" -- start

            # Cleanup
            cd /home/ubuntu/My-Dairy
            rm -f deploy.tar.gz